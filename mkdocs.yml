site_name: Research Regulation Training Guide
site_description: Comprehensive training and reference guide for research regulations and compliance
site_author: Research Compliance Team

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Training Modules:
    - modules/index.md
  - Regulations & Compliance:
    - regulations/index.md
  - Resources:
    - resources/index.md
  - Assessments:
    - assessments/index.md
  - Templates & Forms:
    - templates/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/technical-communicator/Research-Regulation-Training-Guide
